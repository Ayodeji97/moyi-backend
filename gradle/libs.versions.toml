[versions]
kotlin = "2.4.10"
springBoot = "4.1.1"
detekt = "1.23.8"
ktlintPlugin = "14.2.0"
konsist = "0.17.3"
junit = "6.1.3"
mockk = "1.14.11"
kotest = "6.2.5"
owaspDependencyCheck = "13.0.0"
# Argon2id itself. Spring Security's Argon2PasswordEncoder is a thin wrapper
# over BouncyCastle's Argon2BytesGenerator — verified by decompiling it — so
# BouncyCastle is a runtime requirement, not an alternative to it. Not managed
# by the Spring Boot BOM, unlike spring-security itself, so it is pinned here.
bouncycastle = "1.86"
# Token buckets over Redis (doc 25 D6, ADR-0023). The Lettuce adapter is built
# against Lettuce 6 and declares it `provided`; Spring Boot 4 supplies Lettuce
# 7, and the three calls the adapter makes (EVAL, GET, DEL) exist in both —
# verified by the limiter's integration tests against a real Valkey 8.
bucket4j = "8.20.0"
# OpenAPI generation (doc 05, doc 06 §5, ADR-0024). springdoc 3.x is the line
# built for Spring Boot 4 / Jackson 3; swagger-parser validates the document
# the contract test reads back.
springdoc = "3.1.1"
swaggerParser = "2.1.48"

[libraries]
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
bucket4j-lettuce = { module = "com.bucket4j:bucket4j_jdk17-lettuce", version.ref = "bucket4j" }
springdoc-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swaggerParser" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
# flyway-core / flyway-database-postgresql, the postgresql JDBC driver, and
# Testcontainers are NOT pinned here — their versions come from the Spring
# Boot BOM (spring-boot-dependencies) that every Spring-facing module
# already imports via spring-boot-service-convention, per doc 18 §8's
# preference for the framework's own version management over a second
# source of truth.

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
# The two JPA compiler plugins, which do different jobs and are both
# needed (see spring-boot-service-convention.gradle.kts):
#   plugin.jpa     — noarg: synthesises the no-arg constructor JPA requires
#   plugin.allopen — makes @Entity classes non-final so Hibernate can proxy
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owaspDependencyCheck" }
