[versions]
kotlin = "2.2.21"
springBoot = "4.1.1"
detekt = "1.23.8"
ktlintPlugin = "14.2.0"
konsist = "0.17.3"
junit = "6.1.3"
mockk = "1.14.11"
kotest = "6.2.4"
testcontainers = "1.21.4"
flywayPostgres = "13.4.0"
owaspDependencyCheck = "13.0.0"

[libraries]
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywayPostgres" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owaspDependencyCheck" }
