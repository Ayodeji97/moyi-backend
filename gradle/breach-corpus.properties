# The breached-password corpus this build packages (ADR-0012, ADR-0016).
#
# Published by .github/workflows/breach-corpus.yml as a release asset. The
# build downloads it, verifies the SHA-256 below, and fails if it does not
# match — so the corpus is a pinned build input like any dependency, and one
# swapped at the distribution point cannot quietly become the filter we ship.
#
# To move to a newer corpus: run the workflow, then paste the two values it
# prints at the end. Never replace an asset in place; publish a new tag.
version=PENDING
sha256=PENDING
