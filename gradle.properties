# Heap for the Gradle daemon and the Kotlin compile daemon. Without this file both ran on their
# defaults, and as the modules grew CI's `quality` job began failing with
# `java.lang.OutOfMemoryError: GC overhead limit exceeded` while compiling tests (main 9933dec6,
# and twice on PR #198). GitHub's ubuntu-24.04 runner has 16 GB; 3 GB each leaves room for the
# Testcontainers databases the tests start.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
