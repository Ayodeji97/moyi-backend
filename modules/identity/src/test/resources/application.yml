logging:
  level:
    # Same line as app/src/main/resources/application.yml, for the same
    # reason: Hibernate logs "Key (email)=(…)" on the duplicate-registration
    # path. RegistrationEndpointTest asserts the address stays out of the log.
    org.hibernate.orm.jdbc.error: "OFF"

spring:
  datasource:
    hikari:
      # A test context needs two or three connections, not the default ten.
      # Spring caches one context per distinct configuration and every one of
      # them holds a pool for the whole run, so the default multiplied by the
      # number of contexts in this JVM exhausts the Testcontainers Postgres
      # ("FATAL: sorry, too many clients already") — which is what adding one
      # more test class did, with nothing wrong in the code it tested.
      maximum-pool-size: 4
  data:
    redis:
      # No @RedisHash entities; scanning for them costs a startup.
      repositories:
        enabled: false
  jpa:
    hibernate:
      # The guard that makes the entities and the migration one thing rather
      # than two: Hibernate checks every mapped column against the schema
      # Flyway just built, and refuses to start on a mismatch. Without it, a
      # renamed column is discovered by the first query that needs it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Enables the counters UserPersistenceTest asserts on. Statement counts
        # are the only way to see the difference between one INSERT and a
        # SELECT-then-INSERT, since both produce the same row.
        generate_statistics: true

moyi:
  notification:
    email:
      # Tests that care about the email replace the EmailSender bean with a
      # recorder; every other test still boots the configuration, and the
      # default provider refuses to start without a key (ADR-0017).
      provider: log
      from: "Moyi <test@moyi.test>"
  identity:
    verification:
      link-base-url: https://moyi.test/verify
      reset-link-base-url: https://moyi.test/reset-password
  security:
    jwt:
      # A fresh RSA pair per test context; the default source refuses to
      # start without configured PEMs (ADR-0019).
      key-source: ephemeral
    hashing:
      # Same posture for the personal-data hashing secret (ADR-0023).
      secret-source: ephemeral
    rate-limit:
      # Off for the shared context: the lockout tests sign in six times in a
      # row, which is exactly what `auth:login` per email exists to stop, and
      # a bucket that carried over between tests would make each depend on
      # what ran before it. `RateLimitingEndpointTest` turns it on in a
      # context of its own and is the proof that every bucket is wired.
      enabled: false
