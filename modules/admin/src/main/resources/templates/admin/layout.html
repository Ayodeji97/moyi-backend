<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* Fragments every admin page shares. Plain semantic HTML (spec §7, NFR-100): no script,
       no inline style, so the CSP's script-src and style-src 'self' hold. th:text only. */-->
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Moyi admin'">Moyi admin</title>
    <link rel="stylesheet" th:href="@{/admin/static/admin.css}">
</head>
<body>
<header th:fragment="masthead" class="masthead">
    <p class="brand">Moyi admin</p>
</header>
<!--/* The pages' navigation (A2 spec §5): the queues for a moderator only. Not on the error page,
       which every refused read shares byte for byte, whoever reads it. */-->
<nav th:fragment="nav(moderator)" class="nav" aria-label="Console">
    <ul>
        <li><a th:href="@{/admin}">Home</a></li>
        <li th:if="${moderator}"><a th:href="@{/admin/reports}">Reports</a></li>
        <li th:if="${moderator}"><a th:href="@{/admin/quarantine}">Quarantine</a></li>
        <li><a th:href="@{/admin/users}">User lookup</a></li>
    </ul>
</nav>
<!--/* A decision's one-line result, from the flash (spec §5.1): chosen from the outcome, never the note. */-->
<p th:fragment="result" th:if="${result}" class="notice" role="status" th:text="${result}">Dismissed.</p>
</body>
</html>
