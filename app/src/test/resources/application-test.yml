# Applied by `@ActiveProfiles("test")` on the integration tests, rather than a
# test-classpath `application.yml`, which would shadow the real one and quietly
# drop everything it configures.
springdoc:
  api-docs:
    # OpenApiContractTest reads the document from here and compares it with
    # the committed contracts/openapi.json.
    enabled: true

spring:
  datasource:
    hikari:
      # A test context needs two or three connections, not the default ten.
      # Spring caches one context per distinct configuration and every one of
      # them holds a pool for the whole run, so the default multiplied by the
      # number of contexts in this JVM exhausts the Testcontainers Postgres
      # ("FATAL: sorry, too many clients already") — which is what adding one
      # more test class did, with nothing wrong in the code it tested.
      # The other half of the limit is the container's max_connections, raised in
      # PostgresIntegrationTest (common/testing).
      maximum-pool-size: 4
  jpa:
    hibernate:
      # Proves two things at once about the composition root: that
      # `@EntityScan("com.moyi")` really does reach the modules' entities, and
      # that those entities agree with the schema Flyway built from every
      # module's migrations together. Neither is visible from inside a module.
      ddl-auto: validate

moyi:
  identity:
    verification:
      # Required, with no value in application.yml (ADR-0018 amendment of
      # 2026-10-22). `.test` is reserved (RFC 2606) and resolves nowhere, and
      # it is the host the modules' own test contexts use.
      link-base-url: https://moyi.test/verify
      reset-link-base-url: https://moyi.test/reset-password
  bond:
    invite:
      link-base-url: https://moyi.test/i
  scheduling:
    # No job fires on its own in a test; the jobs' own tests call them.
    enabled: false
  notification:
    email:
      # The composition root boots in these tests; nothing in them sends
      # email, and Resend would refuse to start without a key.
      provider: log
      from: "Moyi <test@moyi.test>"
    push:
      # Likewise: nothing here reaches FCM, which would refuse to start
      # without a service account (ADR-0044).
      provider: log
  media:
    storage:
      # R2, the default, refuses to start without a bucket (ADR-0047). The media
      # routes are tested in modules/media against MinIO; here only the
      # composition has to start.
      provider: unavailable
  security:
    jwt:
      key-source: ephemeral
    hashing:
      secret-source: ephemeral
