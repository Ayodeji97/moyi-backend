springdoc:
  api-docs:
    # The OpenAPI document is generated in the test context and committed as
    # contracts/openapi.json (ADR-0024); production serves nothing under
    # /v3/api-docs. Only `local` and the test profile turn this on.
    enabled: false
  # Success bodies are JSON, never `*/*`: the generated client picks its
  # serialiser from this.
  default-produces-media-type: application/json
  # Keys sorted and pretty-printed, so the committed document diffs by
  # meaning and not by the order springdoc happened to discover routes in.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

spring:
  jpa:
    # Keep entities scoped to each service transaction. The bond access guard
    # reads before EndBond takes its row lock; sharing an EntityManager across
    # both would let the locked read reuse the guard's stale bond/version.
    open-in-view: false
  application:
    name: moyi-backend
  threads:
    virtual:
      enabled: true
  data:
    redis:
      # Rate limiting only (doc 25 D6, ADR-0023). Host and port from the
      # environment in production (SPRING_DATA_REDIS_HOST / _PORT); the
      # `local` profile reaches the compose Valkey on the defaults.
      #
      # The timeouts are the fail-open policy made concrete: a Redis that
      # does not answer within this must degrade to "no limit" (the limiter
      # logs and counts it), never to a slow login. Lettuce's own default is
      # sixty seconds, which would turn a Redis outage into a login outage.
      connect-timeout: 500ms
      timeout: 250ms
      # No @RedisHash entities; scanning for them costs a startup.
      repositories:
        enabled: false

logging:
  level:
    # Doc 18 §9: no personal data in a log. Postgres reports a unique
    # violation as "Key (email)=(ada@example.com) already exists", and
    # Hibernate's `org.hibernate.orm.jdbc.error` logger writes that detail at WARN before the
    # exception reaches RegisterUser, which absorbs it (ADR-0015) — so the
    # one expected constraint violation in the system wrote the address to
    # the log on every duplicate registration. Found by scripts/smoke.sh on
    # 2026-09-24. A genuine failure still surfaces: it propagates to the
    # exception handler, which logs the stack trace. AddressNeverLoggedTest
    # holds this line in place; modules/identity's test config carries the
    # same one for its own context.
    org.hibernate.orm.jdbc.error: "OFF"
    # CLAUDE.md: entry text, passwords and tokens never reach a log. The six
    # loggers below print them of their own accord once their level is
    # lowered, whatever the application's own types redact, and
    # LOGGING_LEVEL_ROOT=DEBUG is what gets set during an incident. Each was
    # seen printing the words of an entry, with everything at TRACE, on
    # 2026-10-07 (ADR-0035 decision 16):
    #   - orm.core, at DEBUG: "Listing entities" prints every field of every
    #     managed entity at each flush, EntryEntity.text included. This is
    #     the logger most of Hibernate writes through, so its other DEBUG
    #     output is given up with it;
    #   - orm.jdbc.bind and orm.jdbc.extract, at TRACE: each value bound to a
    #     statement and each value read from a result;
    #   - orm.resource.registry, at TRACE: the driver's statement, which
    #     prints itself with its parameters filled in;
    #   - org.postgresql, at TRACE: the wire protocol's Bind message;
    #   - Tomcat's Http11InputBuffer, at DEBUG: the bytes of every request as
    #     read, so the Authorization header, a password, a refresh token and
    #     an entry's text.
    #
    # What a pin does: a logger with a level of its own keeps it, whatever
    # is set above it. So these hold against LOGGING_LEVEL_ROOT,
    # logging.level.org.hibernate, org.hibernate.orm.jdbc, org.apache and
    # Spring Boot's `sql` and `web` groups, at any level.
    #
    # What it does not do. Setting the level of one of these exact loggers
    # (LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND=TRACE, or a name beneath
    # org.postgresql) overrides the line here: an environment variable
    # outranks this file. `spring.mvc.log-request-details=true` is another
    # switch altogether and prints every request header at TRACE, the bearer
    # token among them: leave it off. And an invite code is part of the path
    # (/invites/{code}/accept), so every logger that prints a request line
    # prints it at DEBUG; those are not pinned (ADR-0035, question 10).
    #
    # SecretsNeverLoggedTest raises every level above these by property and
    # fails if any one of the six lines is removed.
    org.hibernate.orm.core: INFO
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
    org.hibernate.orm.resource.registry: INFO
    org.postgresql: INFO
    org.apache.coyote.http11.Http11InputBuffer: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # Deliberately NOT part of the health verdict. Doc 07 §5: "losing Redis
      # entirely degrades performance and nothing else" — the limiter fails
      # open — and kamal-proxy routes on this endpoint, so a Redis outage
      # reported as DOWN would take the whole application out of rotation to
      # protect a cache. Redis availability is visible instead through the
      # `moyi.rate_limit.backend_unavailable` counter (ADR-0023).
      enabled: false

# Email (doc 25 D7). No provider or key is set here on purpose: the provider
# defaults to Resend, and Resend refuses to start without
# `moyi.notification.email.resend.api-key` and `moyi.notification.email.from`,
# both supplied by the environment. A missing key is a failed boot, not a
# silently mute service — see modules/notification EmailProperties.

moyi:
  identity:
    verification:
      # Where the emailed link lands: a page on the marketing site that hands
      # the token to the app, which POSTs it to /auth/verify-email. Never a GET
      # on this API — mail scanners fetch links, and a scanner must not be able
      # to spend a single-use token. See VerificationProperties.
      link-base-url: https://moyi.com/verify
      reset-link-base-url: https://moyi.com/reset-password
  bond:
    invite:
      # Where an invite link lands (states.md §2): a static page on the
      # marketing site that stores the code for the app and looks nothing up —
      # resolving a code is authenticated (T-06).
      link-base-url: https://moyi.com/i

# Access-token signing (doc 09 §3, ADR-0019). No key here on purpose: the key
# source defaults to CONFIGURED, which refuses to start unless
# `moyi.security.jwt.private-key-pem` and `moyi.security.jwt.public-key-pem`
# arrive from the environment. Only the `local` profile says `ephemeral`.
#
# The same posture for `moyi.security.hashing.secret` (ADR-0023): the HMAC
# key behind `consent_records.ip_hash`, the rate-limit keys and — since
# ADR-0031 — `idempotency_keys.request_hash`, required from the environment,
# ephemeral only in `local`. Changing it makes a retry of an already-recorded
# Idempotency-Key a 422 for up to 24 hours.
#
# `moyi.security.client-address.trusted-proxies` is EMPTY here on purpose:
# with no ranges configured no `X-Forwarded-For` is believed and the socket
# address is the client, which behind a proxy means every request shares one
# address — over-strict and visible, rather than spoofable. Production sets
# it to kamal-proxy's Docker range and Cloudflare's published ranges.
