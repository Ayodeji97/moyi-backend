spring:
  application:
    name: moyi-backend
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Email (doc 25 D7). No provider or key is set here on purpose: the provider
# defaults to Resend, and Resend refuses to start without
# `moyi.notification.email.resend.api-key` and `moyi.notification.email.from`,
# both supplied by the environment. A missing key is a failed boot, not a
# silently mute service — see modules/notification EmailProperties.

moyi:
  identity:
    verification:
      # Where the emailed link lands: a page on the marketing site that hands
      # the token to the app, which POSTs it to /auth/verify-email. Never a GET
      # on this API — mail scanners fetch links, and a scanner must not be able
      # to spend a single-use token. See VerificationProperties.
      link-base-url: https://moyi.com/verify
