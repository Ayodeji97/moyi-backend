springdoc:
  api-docs:
    # Served here, behind the bearer like everything else, so a developer can
    # read the live document: curl -H "Authorization: Bearer …" :8080/v3/api-docs
    enabled: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/moyi
    username: moyi
    password: moyi_dev_only
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

moyi:
  identity:
    verification:
      # Required, with no value in application.yml (ADR-0018 amendment of
      # 2026-10-22). Nothing listens on this port: the link is read from the
      # log, and scripts/smoke.sh reads `token=` and `reset-password?token=`
      # out of these two.
      link-base-url: http://localhost:3000/verify
      reset-link-base-url: http://localhost:3000/reset-password
  bond:
    invite:
      # scripts/smoke.sh checks a new bond's invite link against this value.
      link-base-url: http://localhost:3000/i
  notification:
    email:
      # Local development has no mailbox: the message is written to the log and
      # the verification link is read from there. Only this profile may say
      # `log` — the default is Resend, which refuses to start without a key.
      provider: log
      from: "Moyi <hello@moyi.local>"
    push:
      # No Firebase project on a laptop: a push is a line in the log, with
      # its category and Bond and never its token. FCM, the default, refuses
      # to start without a service account (ADR-0044).
      provider: log
  security:
    jwt:
      # Generated at startup: every token dies with the process, which is fine
      # on a laptop and is logged at WARN so it is never fine anywhere else.
      key-source: ephemeral
    hashing:
      # Likewise: a random secret per process. Address hashes from one run
      # cannot be matched by the next, which does not matter on a laptop.
      secret-source: ephemeral
    client-address:
      # Loopback is trusted so that a request from this machine may say who
      # it is on behalf of: `curl -H 'X-Forwarded-For: 203.0.113.7'` is how
      # scripts/smoke.sh gives each probe its own address and drives the
      # per-IP buckets to their limits. Only this profile.
      trusted-proxies:
        - 127.0.0.0/8
        - ::1/128

logging:
  structured:
    format:
      # Plain text on a laptop: application.yml writes JSON for a log store, and
      # an empty format is Spring Boot's own "not structured".
      console: ""
