# Builds the breached-password Bloom filter that ADR-0012 makes the price of
# the 8-character minimum, and publishes it as a release asset the service
# build pins by digest.
#
# Deliberately NOT part of CI. It pulls roughly 58 GB from Have I Been Pwned —
# about 20 minutes on a GitHub runner — and nothing about it changes between
# commits, so running it per push would be both useless and rude. It runs **twice a year**,
# and on demand when someone wants it sooner.
#
# Twice, not four times: the corpus is a free service's bandwidth, and ~116 GB
# a year is a more honest thing to take from it than ~232 GB for a list whose
# top ten million barely move between quarters. ADR-0012 revisits the corpus
# when it is "more than a year stale", so a six-month cadence still leaves a
# whole missed run of slack before the staleness warning fires.
#
# The output is a single file plus its SHA-256. Pinning the digest in
# `gradle/breach-corpus.properties` is what makes the corpus a build input like
# any other dependency: a file swapped at the distribution point fails the
# build rather than quietly becoming the filter the service ships.
name: Breach corpus

on:
  workflow_dispatch:
    inputs:
      min-count:
        description: >-
          Keep hashes appearing at least this many times. 600 was calibrated
          against 300 live ranges and lands near 10.5M — see BreachCorpusBuilder.
        required: false
        default: "600"
      ranges:
        description: >-
          How many of the 1048576 prefix ranges to pull. Leave empty for all;
          set a few hundred for a smoke run that finishes in seconds.
        required: false
        default: ""
      publish:
        description: Upload the result as a release asset.
        type: boolean
        required: false
        default: true
  schedule:
    # 04:00 UTC on 1 January and 1 July.
    - cron: "0 4 1 1,7 *"

permissions:
  contents: write
  # For the pin PR below. Without it the corpus refreshes and nothing uses it.
  pull-requests: write

concurrency:
  group: breach-corpus
  cancel-in-progress: false

# One definition. The same literal appeared in four places — the build, the
# artifact upload, the release, and the fetch-back — and the first real run
# found all four pointing somewhere the file was not.
env:
  CORPUS: build/pwned-passwords.bloom

jobs:
  build:
    runs-on: ubuntu-latest
    # The download is bound by round trips, not bandwidth or CPU: ~1.05M
    # requests at concurrency 64.
    #
    # The download is bound by round trips: ~1.05M requests at concurrency 64.
    #
    # **Measured, finally, on the thing that runs it.** The full corpus took
    # **19m34s** here — ~893 ranges/s. Two earlier numbers were guesses dressed
    # as estimates: a 300-range sample suggested an hour, and a 130,000-range
    # run on a home connection suggested three. Both were extrapolations from
    # the wrong machine; a runner's network is roughly nine times that
    # connection.
    #
    # Six hours is left as the cap rather than tightened to the measurement. A
    # timeout is there for the run that goes wrong — a Cloudflare slowdown, a
    # retry storm — and sizing it to the happy path converts a slow day into a
    # failed build.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      # 21 as well as 25 for the same reason every other workflow here installs
      # both: gradle/gradle-daemon-jvm.properties pins the daemon to 21, so a
      # missing 21 makes Gradle download one from the foojay URLs in that file.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      # Inputs reach the script through `env`, never through `${{ }}`
      # interpolation into the shell text. A dispatch input is attacker-
      # controlled the moment anyone but the owner has write access, and
      # interpolation splices it into the command before bash ever sees a
      # quote — the same class of hole as string-concatenating SQL.
      # A range-limited build is a smoke test, not a corpus: 300 of 1,048,576
      # ranges is 0.03% of the space, so the filter it produces would wave
      # through essentially every breached password while being, in every
      # observable respect, a working control. `publish` defaults to true, so
      # without this the documented smoke-run path publishes one — and the
      # release body says nothing about the limit, so it could be pinned.
      #
      # Refused here rather than warned about, and refused *before* the hour of
      # downloading rather than after it.
      - if: ${{ inputs.ranges != '' && (github.event_name == 'schedule' || inputs.publish) }}
        name: Refuse to publish a partial corpus
        env:
          RANGES: ${{ inputs.ranges }}
        run: |
          echo "::error::Refusing to publish a $RANGES-range build. A partial corpus is indistinguishable" \
               "from a complete one once it is a file, and this one would cover a fraction of the" \
               "1048576 prefix ranges. Re-run with publish unchecked for a smoke test, or clear ranges" \
               "to build the real corpus."
          exit 1

      - id: build
        env:
          MIN_COUNT: ${{ inputs.min-count || '600' }}
          RANGES: ${{ inputs.ranges }}
        run: |
          set -euo pipefail
          ARGS="--output $CORPUS --min-count $MIN_COUNT"
          if [ -n "$RANGES" ]; then ARGS="$ARGS --ranges $RANGES"; fi
          ./gradlew :tools:breach-corpus:run --args="$ARGS" --console=plain | tee build.log

          # **The builder reporting success is not the same as the file being
          # where we asked for it**, and nothing downstream says so. On the
          # first real run the corpus was written to a different directory;
          # `stat` failed inside a command substitution, which `set -e` does
          # not abort on, so `size` was published empty; upload-artifact logged
          # "No files were found" as a *warning*; and action-gh-release
          # published a release with no asset. All three steps went green.
          #
          # One line, placed where the assumption is made.
          test -f "$CORPUS" || {
            echo "::error::The builder reported success but $CORPUS does not exist."
            exit 1
          }

          # Parsed from the tool's own output rather than recomputed here, so
          # the digest published is the digest of the file it reported on.
          {
            echo "sha256=$(awk '/^  sha256/ {print $2}' build.log)"
            echo "digests=$(awk '/^  digests/ {print $2}' build.log)"
            echo "size=$(stat -c%s "$CORPUS")"
            # Stated in the release body so a partial build could never be
            # mistaken for a corpus even if one reached the artefact store.
            echo "ranges=${RANGES:-1048576}"
            # A hyphen, not a slash. A release asset is served from
            # /releases/download/:tag/:filename, so a tag containing a slash
            # makes the boundary between the two ambiguous — GitHub happens to
            # resolve it, and the build that has to reconstruct this URL should
            # not be relying on that.
            #
            # The time is in the tag, not just the date. A date-only tag
            # collides when a run is retried on the same UTC day, and
            # action-gh-release resolves a collision by *replacing* the asset —
            # which invalidates a SHA-256 somebody has already pinned, and
            # directly contradicts this release's own "never replace an asset
            # in place". Runs are serialised by the concurrency group above and
            # take about twenty minutes, so minutes are enough to separate
            # them.
            echo "tag=corpus-$(date -u +%Y-%m-%d-%H%M)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: pwned-passwords-bloom
          path: ${{ env.CORPUS }}
          retention-days: 7

      # `make_latest: false` — this is a data artefact, not a release of the
      # service, and it must not take over the repository's "Latest" badge.
      # `inputs` is empty on a scheduled run, so the schedule is named explicitly
      # rather than relying on the declared default being applied to it.
      - if: ${{ github.event_name == 'schedule' || inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Breached-password corpus ${{ steps.build.outputs.tag }}
          make_latest: false
          files: ${{ env.CORPUS }}
          body: |
            Breached-password Bloom filter for `moyi-backend` (ADR-0012, ADR-0016).

            Built from the live [Have I Been Pwned](https://haveibeenpwned.com/Passwords)
            Pwned Passwords corpus, keeping every SHA-1 that appears at least
            **${{ inputs.min-count || '600' }}** times.

            | | |
            |---|---|
            | digests | `${{ steps.build.outputs.digests }}` |
            | ranges | `${{ steps.build.outputs.ranges }}` of 1048576 |
            | size | `${{ steps.build.outputs.size }}` bytes |
            | sha256 | `${{ steps.build.outputs.sha256 }}` |

            Pin it by putting the tag and digest in `gradle/breach-corpus.properties`.
            The service build downloads this file and refuses it if the digest
            does not match, so this asset must never be replaced in place —
            publish a new tag instead.

      # The check that used to sit before the upload compared the file's
      # SHA-256 against the digest this same job had printed for it seconds
      # earlier — a file compared with itself, which cannot fail. It was called
      # "verify the published file reads back" and verified nothing of the
      # sort. Reading the filter back through its own format is now the
      # builder's job, where it can look for passwords that must be in any real
      # corpus.
      #
      # What is left for the workflow is the half only the workflow can do:
      # fetch the published asset from the public URL the Gradle build will
      # reconstruct, and check it is the file we pinned. That exercises the tag,
      # the asset name, the URL shape and the artefact store in one go — every
      # part of the chain that a digest computed locally says nothing about,
      # and the part that would otherwise be discovered by somebody's build
      # failing a week later.
      - if: ${{ github.event_name == 'schedule' || inputs.publish }}
        name: Fetch the published asset and verify it
        env:
          TAG: ${{ steps.build.outputs.tag }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.build.outputs.tag }}/pwned-passwords.bloom
        run: |
          set -euo pipefail
          # A release is not always servable the instant the API returns.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 -o published.bloom "$URL"; then break; fi
            echo "Asset not available yet (attempt $attempt); waiting"
            sleep 10
          done
          echo "$SHA256  published.bloom" | sha256sum -c -
          echo "Published asset at $URL matches the digest to pin."

      # ADR-0012 lists, under its negative consequences, that "the pinned dump
      # needs an owner and a refresh cadence, or it silently ages". The cron
      # above is the cadence. This is the owner: a rebuilt corpus that nobody
      # pins is a rebuilt corpus nobody ships, and the failure mode is exactly
      # the silent ageing the ADR warns about — the job goes green twice a year
      # while the service keeps loading a filter from years ago.
      #
      # A PR rather than a push to main: the pin is a security-relevant change
      # and doc 18's PR discipline applies to it like anything else. Note that
      # GITHUB_TOKEN-authored PRs do not trigger workflows, by design — closing
      # and reopening the PR runs CI on it.
      - if: ${{ github.event_name == 'schedule' || inputs.publish }}
        name: Re-pin the corpus
        env:
          TAG: ${{ steps.build.outputs.tag }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          sed -i "s|^version=.*|version=$TAG|" gradle/breach-corpus.properties
          sed -i "s|^sha256=.*|sha256=$SHA256|" gradle/breach-corpus.properties
          git diff --stat gradle/breach-corpus.properties

      - if: ${{ github.event_name == 'schedule' || inputs.publish }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/pin-${{ steps.build.outputs.tag }}
          add-paths: gradle/breach-corpus.properties
          title: "chore: pin the ${{ steps.build.outputs.tag }} breached-password corpus"
          commit-message: |
            chore: pin the ${{ steps.build.outputs.tag }} breached-password corpus

            Published by the Breach corpus workflow: ${{ steps.build.outputs.digests }}
            digests, SHA-256 ${{ steps.build.outputs.sha256 }}.
          body: |
            Opened by the `Breach corpus` workflow. It rebuilt the corpus and
            published it as [`${{ steps.build.outputs.tag }}`](https://github.com/${{ github.repository }}/releases/tag/${{ steps.build.outputs.tag }});
            this pins it so the service actually packages it.

            | | |
            |---|---|
            | digests | `${{ steps.build.outputs.digests }}` |
            | size | `${{ steps.build.outputs.size }}` bytes |
            | sha256 | `${{ steps.build.outputs.sha256 }}` |

            The build downloads the asset and verifies this digest, so merging
            is what makes the new corpus live. **CI will not have run on this
            PR** — `GITHUB_TOKEN`-authored PRs do not trigger workflows; close
            and reopen it to run the checks.
