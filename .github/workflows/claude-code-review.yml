name: Claude Code Review

# Automated review on every PR — the solo-developer substitute for a
# teammate reading the diff (doc 18 §11 names heavy CI automation as
# exactly that substitute).
#
# Run again whenever the PR branch changes. This makes the review describe
# the revision that can actually be merged instead of becoming stale after
# fixup commits. Workflow concurrency below cancels an obsolete run when
# another commit is pushed while a review is still in progress.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: automated-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skips cleanly until CLAUDE_CODE_OAUTH_TOKEN exists rather than
    # failing every PR with a red X in the meantime. See README for the
    # one-time `claude setup-token` step that activates this.
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check review is configured
        id: configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping automated review. Run 'claude setup-token' locally and add the result as a repository secret to enable it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.configured.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Review only the current PR diff. Treat README.md, .github/PULL_REQUEST_TEMPLATE.md,
            build-logic/src/main/kotlin, revision/, docs/, and adr/ as the project's source of truth.
            Check Kotlin idioms and conventions, Spring boundaries, module boundaries, transaction
            and concurrency safety, authorization and privacy, tests, documentation drift,
            migrations, and compatibility with the documented architectural decisions.
            Report only concrete, actionable findings caused by this PR. Include a file and line,
            impact, and suggested correction for every finding; do not post generic praise or
            restate the diff. Do not claim deterministic checks passed or failed—the CI workflow
            owns ktlint, Detekt, compilation, tests, architecture tests, coverage, and secret scans.
          # The review agent needs to *read* the PR before it can comment on
          # it. `--allowedTools` is the whole allowlist, not an addition to a
          # default set: with only the inline-comment tool listed, the first
          # run after the GitHub App was installed finished in 20s over 6
          # turns with one permission denial and zero findings, while a
          # second reviewer on the same diff raised three real issues. The
          # read-only tools below are what the code-review plugin uses to see
          # the diff and the surrounding code; nothing here can write to the
          # repo.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
