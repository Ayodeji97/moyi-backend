name: Claude Code Review

# Automated review on every PR — the solo-developer substitute for a
# teammate reading the diff (doc 18 §11 names heavy CI automation as
# exactly that substitute).
#
# Deliberately NOT triggered on `synchronize` (every push to the branch):
# reviews consume Claude subscription usage, and a review per push on a
# branch that gets several fixup commits is mostly re-reading unchanged
# code. Opening the PR, marking it ready, or reopening it triggers a
# review; to re-run after pushing fixes, comment `@claude review` on the
# PR or re-run this workflow from the Actions tab.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    # Skips cleanly until CLAUDE_CODE_OAUTH_TOKEN exists rather than
    # failing every PR with a red X in the meantime. See README for the
    # one-time `claude setup-token` step that activates this.
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check review is configured
        id: configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping automated review. Run 'claude setup-token' locally and add the result as a repository secret to enable it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.configured.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
