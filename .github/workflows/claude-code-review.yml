name: Claude Code Review

# Automated review on every PR — the solo-developer substitute for a
# teammate reading the diff (doc 18 §11 names heavy CI automation as
# exactly that substitute).
#
# Deliberately NOT triggered on `synchronize` (every push to the branch).
# Step 1 of the code-review plugin aborts when the PR "already has a code
# review from you from earlier", so a per-push trigger yields one real
# review of the first revision plus a no-op run per push after it —
# subscription usage spent to do nothing. Opening the PR, marking it
# ready, or reopening it triggers a review; to re-review after pushing
# fixes, re-run this workflow from the Actions tab.
#
# KNOWN AND UNFIXABLE HERE: claude-code-action refuses to run when this
# file differs from the copy on the default branch, and it signals that
# by *succeeding* — so a PR that edits this workflow gets a green
# `review` check that reviewed nothing. That is the one case the check
# cannot be trusted, so the job below says so out loud in the run summary
# rather than leaving it to be discovered. Changes here are therefore
# only ever proven by merging them and watching the next PR.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# One review at a time per PR. Not cancelled in flight: the plugin's last
# step is a single summary comment posted with `gh pr comment`, so a
# cancelled run has spent the whole review and posted nothing. With the
# trigger list above, concurrent runs are rare enough that queueing the
# second costs nothing worth optimising.
concurrency:
  group: automated-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # Drafts are excluded here rather than inside the plugin's own
    # eligibility check, so an unfinished PR costs nothing at all.
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # Full history: reviewer agent #3 reads git blame and history, and
      # any diff against the base needs the base ref present. A shallow
      # merge-commit-only checkout fails both (cf. ci.yml's gitleaks job).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check review is configured
        id: configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping automated review. Run 'claude setup-token' locally and add the result as a repository secret to enable it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Makes the silent no-op above visible. Without this the only trace
      # is a ##[warning] buried in the action's own step log, on a job
      # that reports success — which is precisely the shape of green
      # check this repo treats as worse than a red one.
      - name: Warn if this PR edits the review workflow
        id: drift
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          workflow=.github/workflows/claude-code-review.yml
          base="origin/$DEFAULT_BRANCH"
          if ! git rev-parse --verify --quiet "$base" > /dev/null; then
            git fetch --depth=1 origin "$DEFAULT_BRANCH" > /dev/null 2>&1 || true
            base=FETCH_HEAD
          fi
          if ! git rev-parse --verify --quiet "$base" > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Could not resolve $DEFAULT_BRANCH, so the workflow-drift check was skipped."
          elif ! git diff --quiet "$base" -- "$workflow"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::This PR changes $workflow, so claude-code-action will skip itself — it requires this file to be identical to the copy on $DEFAULT_BRANCH. The 'review' check will pass WITHOUT reviewing anything. Review this PR by hand, and prove the workflow change by watching the PR after it merges."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # What the PR looked like before the review ran, so that "the review
      # posted nothing" can be distinguished from "the review posted nothing
      # new". Counted across all three surfaces the plugin can deliver on: a
      # summary comment (`gh pr comment` -> issue comments), inline comments
      # (the MCP tool -> pull request review comments), and a formal review.
      - if: steps.configured.outputs.enabled == 'true'
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Summed across pages, not `--jq length` on the first one. A PR with
          # more than a page of comments would otherwise report a count pinned
          # at the page size, and the guard below would compare 30 against 30
          # and conclude nothing was posted — a check silently capped at 30 is
          # the same kind of bug it exists to catch. `--slurp` cannot be
          # combined with `--jq`, hence awk.
          count() { gh api --paginate "$1?per_page=100" --jq 'length' | awk '{s+=$1} END {print s+0}'; }
          issue=$(count "repos/$REPO/issues/$PR/comments")
          inline=$(count "repos/$REPO/pulls/$PR/comments")
          reviews=$(count "repos/$REPO/pulls/$PR/reviews")
          echo "count=$(( issue + inline + reviews ))" >> "$GITHUB_OUTPUT"

      # **Pinned, and the pin is preventive rather than corrective.** `@v1` is
      # a floating tag: it moved 20 times between this repo's last working
      # review (2026-09-01) and its first broken one (2026-09-19), so for three
      # weeks this job could have changed behaviour without a commit. It did
      # not, as it happens — `v1` has resolved to the same commit (`cfc3eb22`,
      # identical to `v1.0.231`) since 2026-09-19T03:12Z, which covers both the
      # failures and the run that fixed them, so the breakage was entirely the
      # expired OAuth token. The pin is here so that the next time this job
      # changes behaviour, a commit says so.
      #
      # Two moving parts remain unpinned and are recorded rather than quietly
      # accepted: `plugin_marketplaces` clones that repository at HEAD on every
      # run, and the action installs whatever Claude Code version is current
      # (2.1.278 today). Neither exposes a version input here.
      - if: steps.configured.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action hides the SDK transcript by default, which is why the
          # token failure above took a bisect across six runs, two wrong
          # diagnoses and a secret-metadata lookup to identify: every failing
          # run said only `is_error: true`.
          #
          # The usual objection is secrets in logs, and it does not apply the
          # way it first looks: Actions masks every registered secret in log
          # output, so the OAuth token appears as `***`. Everything else in the
          # transcript is this public repository and its public diff.
          #
          # Permanent rather than switched on when needed, because switching it
          # on requires editing this file — and an edit to this file makes the
          # action skip itself (see the header). Diagnostics that can only be
          # enabled by a change that cannot be tested are diagnostics that
          # arrive a merge too late.
          show_full_output: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # The plugin's command takes a PR target and nothing else — it
          # has no `--comment` flag (that belongs to the built-in
          # /code-review skill, which is a different command). Passing one
          # only muddies the argument string, so the target is passed
          # alone, as a full URL so `gh pr view` can't misread it.
          prompt: >-
            /code-review:code-review
            ${{ github.event.pull_request.html_url }}

            Review only the current PR diff. Treat README.md, .github/PULL_REQUEST_TEMPLATE.md,
            build-logic/src/main/kotlin, revision/, docs/, and adr/ as the project's source of truth.
            Check Kotlin idioms and conventions, Spring boundaries, module boundaries, transaction
            and concurrency safety, authorization and privacy, tests, documentation drift,
            migrations, and compatibility with the documented architectural decisions.
            Report only concrete, actionable findings caused by this PR. Include a file and line,
            impact, and suggested correction for every finding; do not post generic praise or
            restate the diff. Do not claim deterministic checks passed or failed—the CI workflow
            owns ktlint, Detekt, compilation, tests, architecture tests, coverage, and secret scans.
          # This list is the difference between a review and a green check
          # that reviewed nothing, so it mirrors what the plugin's command
          # actually does rather than trusting its frontmatter to carry
          # over. `Task` is the load-bearing entry: every step is done
          # through subagents ("use a Haiku agent...", "launch 5 parallel
          # Sonnet agents..."), so without it step 1 is denied and the run
          # ends having reviewed nothing — exactly what happened on PR #10
          # (20s, 6 turns, one permission denial, zero findings). The `gh`
          # entries are repeated from that frontmatter on purpose: the
          # frontmatter grants them to the command, and it is not worth
          # betting a silent no-op review on whether that grant reaches
          # the subagents doing the work. `TodoWrite` because the command
          # says "make a todo list first", and `gh pr comment` because
          # step 8 is how the review is delivered — an allowlist without
          # it buys a complete review that cannot post itself.
          # Everything here is read-only apart from that one comment.
          # Kept on one line on purpose: a YAML folded scalar turns each
          # newline into a space, and a space inside the comma-separated
          # tool list is not something worth finding out about in
          # production.
          claude_args: >-
            --allowedTools "Task,Read,Grep,Glob,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git blame:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      # **The check that would have caught today.** With a working token the
      # review ran properly — 24 turns, three models, four and a half minutes,
      # about a dollar of subscription usage — and posted nothing at all on the
      # pull request. Five permission denials, contents unknown because the
      # transcript was hidden. The job reported success.
      #
      # That is the shape this repository keeps being bitten by and has twice
      # written down as a rule: a check that cannot fail is not a check. A
      # review nobody can read is indistinguishable from no review, and worse
      # than none, because the green tick says otherwise.
      #
      # The assumption, stated so it can be argued with: the plugin's last step
      # posts a summary comment whether or not it found anything, so zero new
      # comments means broken rather than clean. If a genuinely clean PR is
      # ever seen to post nothing, this guard is wrong and should become a
      # warning — but a false red is cheap and today's false green was not.
      # Not when this PR edits this workflow. In that case claude-code-action
      # deliberately skips itself and signals it by *succeeding*, so nothing is
      # posted for a reason that has nothing to do with the review being
      # broken — and a guard that fires anyway is a red check on every future
      # change to this file, which is how guards get deleted.
      #
      # Found by this step failing on the very PR that introduced it, which is
      # the only run that could have found it. The drift step is now
      # load-bearing rather than informational.
      - if: steps.configured.outputs.enabled == 'true' && steps.drift.outputs.changed != 'true'
        name: The review must have said something
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          set -euo pipefail
          count() { gh api --paginate "$1?per_page=100" --jq 'length' | awk '{s+=$1} END {print s+0}'; }
          issue=$(count "repos/$REPO/issues/$PR/comments")
          inline=$(count "repos/$REPO/pulls/$PR/comments")
          reviews=$(count "repos/$REPO/pulls/$PR/reviews")
          after=$(( issue + inline + reviews ))

          if [ "$after" -le "$BEFORE" ]; then
            echo "::error::The review ran but posted nothing ($BEFORE before, $after after). It has spent the whole review and delivered none of it, and without this step the check would be green. Open the run log — show_full_output is on — and look for permission denials: the allowlist in claude_args is the usual cause, and it must cover the tools the review's SUBAGENTS use, not only the ones the top-level session uses."
            exit 1
          fi
          echo "The review posted $(( after - BEFORE )) item(s)." >> "$GITHUB_STEP_SUMMARY"
