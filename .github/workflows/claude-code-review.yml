name: Claude Code Review

# Automated review on every PR — the solo-developer substitute for a
# teammate reading the diff (doc 18 §11 names heavy CI automation as
# exactly that substitute).
#
# Deliberately NOT triggered on `synchronize` (every push to the branch).
# Step 1 of the code-review plugin aborts when the PR "already has a code
# review from you from earlier", so a per-push trigger yields one real
# review of the first revision plus a no-op run per push after it —
# subscription usage spent to do nothing. Opening the PR, marking it
# ready, or reopening it triggers a review; to re-review after pushing
# fixes, re-run this workflow from the Actions tab.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# One review at a time per PR, but never cancel one that is mid-flight:
# the plugin posts one inline comment per finding, so cancelling part-way
# leaves a partial review on the PR that no later run will complete.
concurrency:
  group: automated-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # Skips cleanly until CLAUDE_CODE_OAUTH_TOKEN exists rather than
    # failing every PR with a red X in the meantime. See README for the
    # one-time `claude setup-token` step that activates this.
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # Full history: reviewer agent #3 reads git blame and history, and
      # any diff against the base needs the base ref present. A shallow
      # merge-commit-only checkout fails both (cf. ci.yml's gitleaks job).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check review is configured
        id: configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping automated review. Run 'claude setup-token' locally and add the result as a repository secret to enable it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.configured.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Review only the current PR diff. Treat README.md, .github/PULL_REQUEST_TEMPLATE.md,
            build-logic/src/main/kotlin, revision/, docs/, and adr/ as the project's source of truth.
            Check Kotlin idioms and conventions, Spring boundaries, module boundaries, transaction
            and concurrency safety, authorization and privacy, tests, documentation drift,
            migrations, and compatibility with the documented architectural decisions.
            Report only concrete, actionable findings caused by this PR. Include a file and line,
            impact, and suggested correction for every finding; do not post generic praise or
            restate the diff. Do not claim deterministic checks passed or failed—the CI workflow
            owns ktlint, Detekt, compilation, tests, architecture tests, coverage, and secret scans.
          # `Task` is the load-bearing entry: the plugin does all of its
          # work through subagents ("use a Haiku agent...", "launch 5
          # parallel Sonnet agents..."), so without it step 1 is denied and
          # the run ends having reviewed nothing — which is exactly what
          # happened on PR #10 (20s, 6 turns, one permission denial, zero
          # findings). The `gh` commands the plugin needs are already
          # granted by its own command frontmatter, so they are not
          # repeated here. Everything below is read-only apart from posting
          # the review comment itself.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Task,Read,Grep,Glob,Bash(git blame:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
