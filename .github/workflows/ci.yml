name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The two jobs that push to GHCR (image, manifest)
# ask for packages: write themselves; quality and gitleaks never needed it
# and held it only because it used to be granted to the whole workflow.
permissions:
  contents: read

jobs:
  # ktlint, detekt, compile, unit + integration tests (including the
  # Konsist architecture tests — they run inside `app`'s normal test task,
  # not a separate one: re-invoking Gradle a second time just to isolate
  # them would cost more in repeated setup than it buys in report
  # separation, and JUnit's own report already names ArchitectureTest's
  # cases distinctly), the JaCoCo coverage gate, and assemble — doc 25 §7
  # step 9's first six sub-steps, as one Gradle invocation rather than one
  # GitHub Actions job per sub-step (this project's few dozen files don't
  # justify the repeated per-job setup cost that split would add).
  quality:
    # Pinned rather than ubuntu-latest: that label is moving to Ubuntu 26,
    # and this job is the one that depends on the runner's image — the
    # Docker engine Testcontainers talks to and the preinstalled JDKs. A
    # runner upgrade should arrive as a reviewed one-line PR, not as a red
    # main nobody changed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Both installed so neither has to be downloaded at build time. 25 is
      # what the project targets (compile/test/run, via jvmToolchain(25) in
      # build-logic — Gradle provisions it out-of-process for tasks that
      # support toolchain selection); the Gradle *daemon* runs on 21,
      # because detekt's CLI runs in-process in the daemon's own JVM
      # (confirmed by decompiling its invoker) and detekt 1.23.8 throws a
      # bare GradleException from its own version check under a Temurin 25
      # daemon.
      #
      # Which JDK launches the daemon is no longer decided by the ORDER of
      # this list. It is declared outright in
      # gradle/gradle-daemon-jvm.properties (Gradle 9 daemon JVM criteria),
      # added 2026-09-19 so that local builds stop diverging from CI. The
      # ordering trick worked but was invisible, and an earlier version of
      # this comment claimed a locally-installed Temurin 25 did NOT hit the
      # failure — it does. That claim is what let `./gradlew build` sit
      # broken locally while CI stayed green. See
      # kotlin-common-convention.gradle.kts and docs/learning-log.md.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests
            **/build/reports/detekt
            **/build/reports/ktlint
            **/build/reports/jacoco
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the deployable image (Spring Boot's own Cloud Native Buildpacks
  # support — no hand-maintained Dockerfile) once per CPU architecture, and
  # on a real merge to main publishes it to GHCR. No deploy stage: nothing
  # pulls this image anywhere yet (CD is a follow-up plan, per doc 25 §7
  # steps 10-12 being out of scope here) — this just makes the artifact a
  # future deploy stage will need exist on every merge.
  #
  # Two architectures because the planned host is a Hetzner CAX server,
  # which is ARM (linux/arm64); amd64 stays so the same tag still runs on
  # an x86 machine. Each is built NATIVELY on a runner of its own
  # architecture (ubuntu-24.04-arm is GitHub's hosted ARM runner, free for
  # public repositories) rather than under QEMU emulation on one runner:
  # emulating a whole buildpack build is several times slower, and
  # bootBuildImage drives the Docker daemon directly, so there is no
  # buildx --platform to hand it anyway.
  #
  # No imagePlatform is set in app/build.gradle.kts: Boot (4.1.1 here)
  # asks the daemon for its own platform and pulls the builder and run
  # image for it. The default builder, paketobuildpacks/builder-noble-java-tiny,
  # and its run image, ubuntu-noble-run-tiny, are both published for
  # linux/amd64 and linux/arm64. Checked 2026-10-22 on an Apple Silicon
  # Mac: Boot logged "Pulling run image ... for platform 'linux/arm64'",
  # the image's Architecture was arm64, and it started on Java 25.
  #
  # Runs on pull requests too, without pushing, so a PR proves both
  # architectures still build. It waits for quality and gitleaks, as the
  # old single-arch publish job did, so nothing is ever pushed for a
  # commit that failed them; on a PR that costs a few minutes of
  # wall-clock after quality, which was judged cheaper than giving that
  # guarantee up.
  #
  # A PR that changes this job proves only the build half on its own run.
  # The login, the push and the manifest job below run only on
  # push-to-main, so they are proven by the first run after merge and by
  # nothing before it.
  image:
    # A short, stable check name per architecture, "image (amd64)" and
    # "image (arm64)": these are what branch protection should require, so
    # that a PR breaking one architecture cannot merge and then leave
    # `latest` silently stuck when main's arm64 leg fails.
    name: image (${{ matrix.arch }})
    needs: [quality, gitleaks]
    strategy:
      # One architecture failing should not cancel the other: on a PR the
      # useful answer is which of the two broke, not just that one did.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Job-level permissions replace the workflow's, so contents: read is
    # restated. The `permissions` key cannot vary with the event, so
    # packages: write is granted on PRs too, where nothing is pushed; a PR
    # from a fork gets a read-only token whatever this says.
    permissions:
      contents: read
      packages: write
    steps:
      # persist-credentials: false, because this job then runs the PR's own
      # Gradle code (bootBuildImage), and a token left in .git/config would
      # be readable by it, with packages: write on a same-repo PR.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 21 as well as 25, even though this job never runs detekt: the
      # daemon JVM is now declared repo-wide in
      # gradle/gradle-daemon-jvm.properties, so EVERY Gradle invocation
      # needs a 21 available — including this one. Without it Gradle falls
      # back to downloading 21 from the foojay URLs in that file, which
      # adds a download to every build and fails outright if those
      # pinned URLs ever rot.
      #
      # Before this job ran on pull requests, a PR could never prove this
      # line was right; it was found by reading, not by a green check. It
      # now runs on every PR, on both architectures.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The per-architecture tag (<sha>-amd64, <sha>-arm64) is a staging
      # name: the manifest job below gathers both under <sha> and latest,
      # which are the tags anything should pull.
      - run: |
          ./gradlew :app:bootBuildImage \
            --imageName=${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}

      # The tag claims an architecture; this makes the image prove it. If a
      # runner label ever maps to a different machine than its name says,
      # or Boot stops following the daemon's platform, the manifest below
      # would list the wrong platform under the right name, and nothing
      # else here would notice until an ARM server failed to start it.
      - run: |
          built=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.arch }})
          echo "built $built"
          test "$built" = "linux/${{ matrix.arch }}"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}

  # Publishes <sha> and latest as one multi-arch tag: an OCI index that
  # points at both per-architecture images, so a docker pull on the ARM
  # host and on an x86 machine each get their own. Built in the registry
  # by buildx imagetools (preinstalled on GitHub's Ubuntu runners), which
  # copies no layers — it only writes the index.
  #
  # Only on push-to-main, so no PR, including one that edits this job, can
  # prove it; the first run after merge is its test. If a later merge
  # cancels this run (the concurrency group above), the per-arch tags of
  # the cancelled commit stay behind without a <sha> or latest; nothing
  # pulls them, and the next run publishes its own.
  manifest:
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves only if this commit is still main's head. Re-running
      # an old run would otherwise move `latest` backwards, and `latest` is
      # the tag a deploy pulls. The `<sha>` tag is always written.
      - id: create
        env:
          NAME: ${{ steps.image.outputs.name }}
          SHA: ${{ github.sha }}
        run: |
          tags=(--tag "$NAME:$SHA")
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$head" = "$SHA" ]; then
            tags+=(--tag "$NAME:latest")
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head, past $SHA: latest is left where it is"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$NAME:$SHA-amd64" \
            "$NAME:$SHA-arm64"

      # Reads back what the registry now holds rather than trusting that
      # create succeeded: both tags must be an index listing exactly
      # linux/amd64 and linux/arm64, and must be the same index. Entries
      # whose platform is unknown/unknown are attestations, not images, and
      # are left out of the comparison.
      - env:
          NAME: ${{ steps.image.outputs.name }}
          SHA: ${{ github.sha }}
          LATEST: ${{ steps.create.outputs.latest }}
        run: |
          expected=$'linux/amd64\nlinux/arm64'
          tags=("$SHA")
          if [ "$LATEST" = true ]; then tags+=(latest); fi
          for tag in "${tags[@]}"; do
            platforms=$(docker buildx imagetools inspect --raw "$NAME:$tag" \
              | jq -r '.manifests[].platform
                       | select(.os != "unknown")
                       | "\(.os)/\(.architecture)"' \
              | sort)
            echo "$NAME:$tag -> ${platforms//$'\n'/ }"
            test "$platforms" = "$expected"
          done
          if [ "$LATEST" = true ]; then
            # Assigned first, so a failed inspect stops the step (errexit) rather
            # than hashing two empty strings that compare equal.
            by_sha=$(docker buildx imagetools inspect --raw "$NAME:$SHA")
            by_latest=$(docker buildx imagetools inspect --raw "$NAME:latest")
            test -n "$by_sha"
            test "$by_sha" = "$by_latest"
          fi
