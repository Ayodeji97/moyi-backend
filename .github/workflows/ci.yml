name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ktlint, detekt, compile, unit + integration tests (including the
  # Konsist architecture tests — they run inside `app`'s normal test task,
  # not a separate one: re-invoking Gradle a second time just to isolate
  # them would cost more in repeated setup than it buys in report
  # separation, and JUnit's own report already names ArchitectureTest's
  # cases distinctly), the JaCoCo coverage gate, and assemble — doc 25 §7
  # step 9's first six sub-steps, as one Gradle invocation rather than one
  # GitHub Actions job per sub-step (this project's few dozen files don't
  # justify the repeated per-job setup cost that split would add).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests
            **/build/reports/detekt
            **/build/reports/ktlint
            **/build/reports/jacoco
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the deployable image (Spring Boot's own Cloud Native Buildpacks
  # support — no hand-maintained Dockerfile) and publishes it to GHCR.
  # Only on a real merge to main, never on PRs. No deploy stage: nothing
  # pulls this image anywhere yet (CD is a follow-up plan, per doc 25 §7
  # steps 10-12 being out of scope here) — this just makes the artifact a
  # future deploy stage will need exist on every merge.
  publish:
    needs: [quality, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - run: |
          ./gradlew :app:bootBuildImage \
            --imageName=${{ steps.image.outputs.name }}:${{ github.sha }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker tag ${{ steps.image.outputs.name }}:${{ github.sha }} ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:latest
