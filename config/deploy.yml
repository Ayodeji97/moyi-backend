# Kamal 2: how Moyi runs in production (M3 Deploy Plan; doc 10 §2, §4).
#
# One server runs everything: the app (as two roles, the API and the media
# worker), Postgres, Valkey and kamal-proxy, each in a container (ADR-0007,
# ADR-0052). kamal-proxy owns TLS and the cutover between the
# old and the new container (ADR-0011).
#
# The image is never built here. CI builds it for linux/arm64 and linux/amd64
# on every merge to main and publishes it to GHCR under the commit's SHA, so a
# deploy names a commit that is already on main and has passed CI:
#
#   git switch main && git pull --ff-only
#   kamal deploy --skip-push --version=$(git rev-parse HEAD)
#
# Pull, not just fetch: Kamal pulls the image for --version but reads THIS
# file from the working tree, so a stale checkout boots the new image with
# old config. .kamal/hooks/pre-deploy refuses a deploy unless HEAD is the
# version, no tracked file is modified, and HEAD is origin/main.
#
# That commit's CI run must have finished (its `manifest` job writes the tag),
# and it must be a commit from after the `service` label was added to the
# image build (now app/Dockerfile): Kamal refuses an image without it.
#
# Rolling back past #116 (the first release with the media-worker role) is
# `kamal rollback <sha> --roles=web`: Kamal 2.12 refuses a rollback unless a
# container of that version exists for every role it is asked about, and no
# media-worker container exists for an older version. The worker then stays
# on the newer image (ADR-0052; README, "How do I deploy it").
#
# A rollback is not a way to switch anything off. Kamal 2.12's `rollback`
# boots the older image with a fresh `docker run`, its environment taken from
# THIS checkout's config/deploy.yml and .kamal/secrets (Cli::Main#rollback
# invokes app boot; Cli::App::Boot#start_new_version uploads the role's
# secrets and Commands::App#run passes the role's env), and the pre-deploy
# hook holds this checkout to origin/main. So the image goes back and the
# configuration does not: with storage on here, an older image starts with
# R2 configured. Switching storage off is a pull request, ready-made on the
# branch ops/media-storage-off (ops/media-worker/README.md, "To switch off
# again"; review of #117).
#
# The explicit --version matters. Without it Kamal tags the deploy with the
# local HEAD, and appends "_uncommitted_<random>" when the working tree has
# any change, even an untracked file; no such tag exists in GHCR.
#
# Secrets are listed below by name only. Their values come from Bitwarden at
# deploy time, through .kamal/secrets; none is ever written to this repository.

service: moyi

# The registry's server is prefixed, so this is
# ghcr.io/ayodeji97/moyi-backend:<version>. GHCR names are lowercase; the
# repository is Ayodeji97/moyi-backend.
image: ayodeji97/moyi-backend

minimum_version: 2.12.0

# Two roles run the one image (app/Dockerfile; ADR-0052): `web`, the API
# behind kamal-proxy, and `media-worker`, which decodes what users upload. The
# env below applies to both; each role's own env is merged over it.
servers:
  web:
    hosts:
      - 91.98.71.136 # moyi-prod-1, Hetzner CAX21 (Arm64), Nuremberg
    options:
      # The app's share of the 8 GB box (doc 10 §2.1). During a deploy a
      # second container runs beside the first for up to drain_timeout, so
      # twice this is briefly in use.
      memory: 2g
    env:
      clear:
        # The JVM sized to the 2 GB above by the buildpack memory calculator's
        # own formula (ADR-0052 shows the arithmetic): 2 GB less 10M direct
        # memory, the metaspace cap, 240M of code cache and 250 threads at 1M
        # is the heap. Production's image (ce41f22, 29,533 classes) was given
        # 180948K of metaspace and -Xmx1404203K. The metaspace cap is raised to
        # 256m, because this image's API was measured using 155 MB of a 168 MB
        # cap and rising (review of #116), and the heap lowered by the same
        # 79 MiB, so the total is what the calculator budgeted.
        # ProductionStartsWithoutMediaSecretsTest holds MaxMetaspaceSize >= 256m.
        JAVA_TOOL_OPTIONS: >-
          -XX:+ExitOnOutOfMemoryError -XX:MaxDirectMemorySize=10M -Xmx1292m
          -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=240M -Xss1M
      # The API's secrets, merged over the top-level ones (Kamal 2.12,
      # Role#env): the session-signing pair, the HMAC key behind ip_hash and
      # the rate limits, and the email key. The media worker gets none of them.
      secret:
        - MOYI_SECURITY_JWT_PRIVATE_KEY_PEM
        - MOYI_SECURITY_JWT_PUBLIC_KEY_PEM
        - MOYI_SECURITY_HASHING_SECRET
        - MOYI_NOTIFICATION_EMAIL_RESEND_API_KEY

  # The media worker (the owner's Q5 and his ruling of 2026-10-29: a role, not
  # an accessory, so it is redeployed with the application). The same image,
  # with the `media-worker` profile: no web server, only the media pipeline's
  # consumers, no timed job but the outbox poller (application-media-worker.yml).
  #
  # It takes up each upload the API has accepted into R2 (MOYI_MEDIA_STORAGE_R2_*
  # below), from the bucket, through a network limited to Postgres and
  # Cloudflare by a service on the host that must be installed first
  # (ops/media-worker/README.md, which has the switch-on runbook).
  media-worker:
    hosts:
      - 91.98.71.136
    # Not behind kamal-proxy (`proxy` is off for any role but the primary
    # unless asked for): it has no port. Kamal instead waits for Docker's
    # health check below to say `healthy` before it calls the deploy done.
    options:
      # Q5's 768 MB proved too tight (ADR-0052 decision 4): the JVM is ~440
      # MiB resident and a decode at the ceiling up to ~350 MiB more, with
      # the tmpfs's work files beside them. 1 GB, on the review of #116's
      # ruling; the box has room for it.
      memory: 1g
      cpus: 1.5
      # Nothing in the image may be written: a decoder that is subverted
      # cannot leave anything behind. The one writable place is /tmp, in
      # memory (it counts against the 1g), where the JVM and each photo's
      # work directory live and die with the container.
      read-only: true
      tmpfs: /tmp:rw,noexec,nosuid,nodev,size=128m
      # The image runs as `moyi` (uid 10001), never root; with no capability
      # and no privilege to gain, a decoder that is subverted stays that user.
      cap-drop: ALL
      security-opt: no-new-privileges
      # The ready file (ReadyFile): written once the application has started,
      # so after the start-up checks of libvips and ffmpeg in the sandbox and
      # the registration of the worker's consumers. Kamal waits for `healthy`
      # up to deploy_timeout.
      health-cmd: test -f /tmp/moyi-ready
      health-interval: 30s
      health-start-period: 120s
      health-start-interval: 2s
      health-timeout: 3s
      health-retries: 3
    env:
      clear:
        SPRING_PROFILES_ACTIVE: media-worker
        # The one container that decodes uploads (ADR-0048, ADR-0049). Every
        # other container gets "off" from the env below; only this role
        # overrides it.
        MOYI_MEDIA_PROCESSING_PROVIDER: native
        # glibc's malloc reserves an arena of address space per thread, and
        # the JVM has dozens. The sandbox sets the same for every program it
        # starts, which is where it matters (ulimit -v counts reservations, not
        # resident memory; ADR-0052 decision 4); here it keeps the JVM's own
        # reservations down too.
        MALLOC_ARENA_MAX: 2
        # The JVM capped, so that it and one decode fit in the container (ADR-0048 §3's
        # arithmetic, measured in ADR-0052: about 430 MiB resident, of which
        # the heap is ~160 MiB committed; the rest is metaspace, code and the
        # JVM's own). 192m rather than the 256m first proposed: the measured
        # resident memory was the same under both, and a lower cap bounds how
        # far the heap can grow beside a decode. Serial GC: one thread does
        # the work here, and it is the collector with the least overhead.
        JAVA_TOOL_OPTIONS: >-
          -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -Xmx192m -Xss512k
          -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=16m

ssh:
  user: root
  # Only this key, never whatever else ssh-agent offers. The key has a
  # passphrase; the macOS keychain unlocks it.
  keys_only: true
  keys:
    - ~/.ssh/moyi_hetzner

registry:
  server: ghcr.io
  username: ayodeji97
  password:
    - KAMAL_REGISTRY_PASSWORD

# Never used: every deploy is --skip-push. Stated so that a deploy run
# without that flag builds for the server's architecture only, not Kamal's
# default of both, from the Dockerfile CI builds from (ADR-0052), whose
# context is the boot jar's directory: `./gradlew :app:bootJar` first. A
# context also means Kamal builds from the working tree rather than from a
# clean clone of the commit (its default when no context is set), and a clone
# would hold no jar: such a build would fail. Unused while every deploy is
# --skip-push.
builder:
  arch: arm64
  dockerfile: app/Dockerfile
  context: app/build/libs

proxy:
  host: api.getmoyi.app
  # Let's Encrypt, issued by kamal-proxy on the first deploy. Needs the DNS
  # record to point straight at the server (Cloudflare "DNS only"; the plan's
  # D8) and ports 80 and 443 open in the Hetzner firewall.
  ssl: true
  app_port: 8080
  # With ssl: true kamal-proxy drops X-Forwarded-For unless told otherwise.
  # Without it every request reaches the app from the proxy's address, and
  # all clients share one rate-limit bucket (ADR-0023). The app believes the
  # header only from MOYI_SECURITY_CLIENT_ADDRESS_TRUSTED_PROXIES.
  forward_headers: true
  # No request log at all (owner's ruling D9, 2026-10-24). kamal-proxy logs
  # every request's path and query, which here means search words (?q=) and
  # invite codes, and nothing in this repository may log those (CLAUDE.md;
  # ADR-0039). Kamal offers no filter, so the proxy container gets Docker's
  # `none` log driver, and the 10 MB log option Kamal adds by default is
  # dropped because that driver refuses options. The cost: no proxy log to
  # debug with. To debug, switch it on deliberately, then off again.
  run:
    log_max_size: ""
    options:
      log-driver: none
  healthcheck:
    # The `proxy` health group (application.yml), on the application's port:
    # every indicator but Redis, and no details. /actuator/* lives on 8081,
    # which nothing outside the container reaches.
    path: /healthz
    interval: 3
    timeout: 3

# The first boot runs every migration and loads the breach-corpus filter on
# an Arm JVM, well past Kamal's 30-second default. Measure, then tighten.
deploy_timeout: 120

env:
  clear:
    # The accessories below, by container name on Kamal's Docker network.
    SPRING_DATASOURCE_URL: jdbc:postgresql://moyi-postgres:5432/moyi
    SPRING_DATASOURCE_USERNAME: moyi
    SPRING_DATA_REDIS_HOST: moyi-valkey
    SPRING_DATA_REDIS_PORT: 6379
    # Pages on the website (deploy session 5), never this API: a link in an
    # email is fetched by mail scanners (ADR-0018, ADR-0022).
    MOYI_IDENTITY_VERIFICATION_LINK_BASE_URL: https://getmoyi.app/verify
    MOYI_IDENTITY_VERIFICATION_RESET_LINK_BASE_URL: https://getmoyi.app/reset-password
    MOYI_BOND_INVITE_LINK_BASE_URL: https://getmoyi.app/i
    # getmoyi.app is verified in Resend (SPF, DKIM and DMARC pass).
    MOYI_NOTIFICATION_EMAIL_FROM: Moyi <hello@getmoyi.app>
    # Since slice N3 (#100) production requests pushes, and each one is written
    # to the log, not sent, until there is a Firebase project (ADR-0044). The
    # log line names the category and the bond, never the token, and the
    # ledger settles it as "not-sent:log", never as a delivery. To send:
    # remove this line and add MOYI_NOTIFICATION_PUSH_FCM_PROJECT_ID
    # here and _CLIENT_EMAIL and _PRIVATE_KEY_PEM as secrets; without them the
    # default provider, FCM, refuses to start.
    MOYI_NOTIFICATION_PUSH_PROVIDER: log
    # Media is stored in R2 (ADR-0047), the default provider: the bucket
    # `moyi-media`, in Cloudflare's EU jurisdiction, with a token scoped to it
    # alone (Object Read & Write). The endpoint and both halves of the token
    # are secrets below; the endpoint too, because it names the Cloudflare
    # account, which this public repository does not (ADR-0052). Both roles
    # need all four: the API signs upload and download URLs, checks each
    # completion against the stored object, and deletes and purges; the worker
    # reads each upload and writes what it makes of it. Without any one of
    # them R2 refuses to start, naming it. To switch storage off again, the
    # line is MOYI_MEDIA_STORAGE_PROVIDER: unavailable (ops/media-worker/README.md).
    MOYI_MEDIA_STORAGE_R2_BUCKET: moyi-media
    # No photo or voice note is processed by the API (ADR-0048, ADR-0049): the
    # owner ruled that uploads are decoded in a media worker of their own
    # (Q5), the `media-worker` role above, which alone overrides this with
    # `native`. Never remove it from here. Since ADR-0052 the image carries
    # libvips and ffmpeg for the worker, so NATIVE, the default, would no
    # longer refuse to start in the API: it would decode uploads on the API's
    # outbox thread. ProductionStartsWithoutMediaSecretsTest holds this line,
    # and that only the worker overrides it.
    # Quoted: YAML 1.1, which Kamal reads, takes a bare off for the boolean false.
    # Spring Boot would read "false" as OFF anyway (seen), but the file says what it means.
    MOYI_MEDIA_PROCESSING_PROVIDER: "off"
    # No photo is moderated until the owner has made the AWS account, the IAM
    # user with rekognition:DetectModerationLabels alone, and its key
    # (ADR-0051). `none` fails closed: no photo gets a verdict, so no partner
    # is ever shown one; it passes nothing. With storage on, that is the
    # product as it stands: an author sees their own photos and voice notes,
    # and their partner sees none of them, until the owner decides moderation.
    # Never `stand-in`, which decides by colour for local runs. To moderate: remove this line and add
    # MOYI_MEDIA_MODERATION_REKOGNITION_ACCESS_KEY_ID and
    # _SECRET_ACCESS_KEY as secrets; without them the default provider,
    # Rekognition, refuses to start. (The API processes nothing, so
    # moderates nothing either way: the line keeps it starting. The media
    # worker is where moderation runs; ops/media-worker/README.md has the
    # network limit Rekognition's addresses must be added to.)
    MOYI_MEDIA_MODERATION_IMAGE_PROVIDER: none
    # No known-CSAM hash list is consulted and no voice note is moderated:
    # neither has a vendor yet (ADR-0051 decisions 3 and 5, the owner's to
    # choose). `none` is their default; said here so the file says what runs.
    # A voice note with no verdict is never played to a partner.
    MOYI_MEDIA_MODERATION_KNOWNIMAGES_PROVIDER: none
    MOYI_MEDIA_MODERATION_VOICE_PROVIDER: none
    # Kamal's Docker network on moyi-prod-1, where kamal-proxy has its address
    # (`docker network inspect kamal`, read 2026-10-24). An X-Forwarded-For is
    # believed only from here, so the rate limiter sees each client's own
    # address, and a header a client forges is not believed, because the
    # walk from the right stops at the first untrusted address (ADR-0023).
    # Without it every request shares kamal-proxy's one bucket: seen,
    # requests from two networks and one with a forged header all landed in
    # a single per-IP login bucket. The network keeps its range while it
    # exists; on a rebuilt server, read it again before the first deploy.
    MOYI_SECURITY_CLIENT_ADDRESS_TRUSTED_PROXIES: 172.18.0.0/16
    # Argon2id's iterations, tuned on this server to doc 09's ~150 ms per
    # hash (Argon2Properties; NFR-046's t=2 stays the floor the tests hold).
    # Measured 2026-10-24 on moyi-prod-1, in the production image, with
    # scripts/argon2-bench: t=2 61 ms, t=4 106, t=5 120, t=6 147 and 155
    # (two runs, p95 164 and 172), t=7 174, t=8 195 (medians of 15). Each
    # concurrent hash still holds ~19 MiB off-heap; the iterations add time,
    # not memory.
    #
    # Changing it once accounts exist opens a timing oracle (ADR-0020). A
    # stored hash is verified at the t it was made with, while an unknown
    # email is checked against a dummy hash made at startup with the current
    # t. Raise t over existing t=2 hashes and a wrong password for a real
    # account answers faster than an unknown address, which tells an
    # attacker the address is registered. Set to 6 while production had no
    # accounts (0 rows in credentials, 2026-10-24), so every hash is made at
    # t=6. Before changing it again, make failed verifications cost the same
    # whatever t the stored hash carries; rehashing on login alone leaves
    # accounts that never log in distinguishable (review of #83).
    MOYI_SECURITY_ARGON2_ITERATIONS: 6
  # Only what both roles need: the database and the bucket. The API's own
  # secrets are in servers.web.env.secret, so the worker, which decodes what
  # strangers upload, never holds the key that signs sessions, the HMAC key or
  # the email key (review of #117; ADR-0052, "Switched on").
  # ProductionStartsWithoutMediaSecretsTest holds the split.
  secret:
    - SPRING_DATASOURCE_PASSWORD:POSTGRES_PASSWORD
    - MOYI_MEDIA_STORAGE_R2_ENDPOINT
    - MOYI_MEDIA_STORAGE_R2_ACCESS_KEY_ID
    - MOYI_MEDIA_STORAGE_R2_SECRET_ACCESS_KEY

accessories:
  # Neither accessory publishes a port: they are reachable only on Kamal's
  # Docker network, never on the server's address (doc 10 §8: "the single
  # most common way a hobby project leaks its entire database").
  postgres:
    image: postgres:18
    host: 91.98.71.136
    # Tuned to Postgres's share of the box, not the whole of it (doc 10 §2.1).
    cmd: postgres -c shared_buffers=512MB -c effective_cache_size=1536MB
    env:
      clear:
        POSTGRES_USER: moyi
        POSTGRES_DB: moyi
      secret:
        - POSTGRES_PASSWORD
    directories:
      # Postgres 18's image keeps its data under /var/lib/postgresql/18/...;
      # mount the parent, as docker-compose.yml does. On the server this is
      # /root/moyi-postgres/data.
      - data:/var/lib/postgresql
    options:
      memory: 2g
      # Docker's default /dev/shm is 64 MB, and Postgres uses it for parallel
      # queries and sorts.
      shm-size: 256m

  valkey:
    image: valkey/valkey:8
    host: 91.98.71.136
    # Rate-limit buckets only (ADR-0023), which fail open. appendonly keeps
    # them across a restart (doc 10 §2). The buckets carry a TTL, so at the
    # memory ceiling the oldest of them go first, below the container's limit
    # so that Valkey evicts rather than being killed.
    cmd: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    directories:
      - data:/data
    options:
      memory: 384m
